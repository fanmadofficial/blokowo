<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Blokowo</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font:13px sans-serif;color:#fff}
[hidden]{display:none!important}
.scr{position:fixed;inset:0;background:#123;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:5}
.pn{position:fixed;background:#000a;padding:8px;z-index:3;line-height:1.9}
input,select,textarea,button{font:inherit;padding:3px}
#log{height:130px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#props input[type=number]{width:62px}
#note{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#000b;padding:4px 10px;z-index:9}
#glist button{margin:3px;padding:8px 16px}
</style></head><body>
<div id="conn" class="scr"><h1>Blokowo</h1>
 <input id="addr" value="localhost:3000" placeholder="adres serwera (host:port lub https://...)">
 <input id="nick" maxlength="16" placeholder="nick">

 <button id="bc">Połącz</button></div>
<div id="lobby" class="scr" hidden><h2>Gry na serwerze</h2><div id="glist"></div>
 <div><button id="bref">Odśwież</button></div></div>
<div id="hud" class="pn" hidden style="left:8px;bottom:8px;width:330px">
 <div id="log"></div><input id="msg" maxlength="120" style="width:100%" placeholder="Enter – czat · Esc – wyjście · WASD · Spacja"></div>
<div id="note" hidden></div>
<div id="info" class="pn" hidden style="right:8px;top:8px;min-width:150px;white-space:pre"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id), FILE = /^[\w-]{1,40}\.(png|jpe?g|gif|webp)$/i, PH = 3.4;
const ren = new THREE.WebGLRenderer({ antialias: true }); ren.setSize(innerWidth, innerHeight); document.body.prepend(ren.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87ceeb);
const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 800);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 1));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(30, 60, 20); scene.add(sun);
const TL = new THREE.TextureLoader(); TL.setCrossOrigin('anonymous');
let world = new THREE.Group(); scene.add(world);
const parts = new Map(), V = new THREE.Vector3(), assets = new Set();
let HTTP = '', sock, key = '', mode = 'conn', G = null, myId = 0, nt;

const show = m => { mode = m; ['conn', 'lobby', 'hud'].forEach(i => $(i).hidden = i !== m); $('info').hidden = true; };
const send = o => sock && sock.readyState === 1 && sock.send(JSON.stringify(o));
function note(t) { $('note').hidden = false; $('note').textContent = t; clearTimeout(nt); nt = setTimeout(() => $('note').hidden = true, 4000); }
function log(t) { const d = document.createElement('div'); d.textContent = t; $('log').appendChild(d); while ($('log').children.length > 7) $('log').firstChild.remove(); }

// ---------- świat ----------
function setTex(mat, tex) { mat.map = FILE.test(tex || '') ? TL.load(HTTP + '/resources/' + tex) : null; mat.needsUpdate = true; }
function mkPart(d) {
  const mat = new THREE.MeshLambertMaterial({ color: /^#[0-9a-f]{6}$/i.test(d.color) ? d.color : '#888888' });
  setTex(mat, d.tex);
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
  m.scale.set(...d.size); m.position.set(...d.pos); world.add(m);
  const p = { id: d.id, d, mesh: m, size: d.size, collide: d.collide !== false, hidden: false, tex: d.tex };
  m.userData.p = p; parts.set(d.id, p); return p;
}
function build(g) {
  scene.remove(world); world = new THREE.Group(); scene.add(world); parts.clear();
  if (g.ground) { const m = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshLambertMaterial({ color: g.ground })); m.rotation.x = -Math.PI / 2; world.add(m); }
  g.parts.forEach(mkPart);
}
function label(t) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d'); x.font = 'bold 32px sans-serif'; x.textAlign = 'center';
  x.fillStyle = '#0008'; x.fillRect(0, 8, 256, 48); x.fillStyle = '#fff'; x.fillText(t, 128, 44);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(3, 0.75, 1); s.position.y = 4.2; return s;
}
function avatar(color, name) {
  const g = new THREE.Group(), b = (w, h, d, y, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: c })); m.position.y = y; g.add(m); };
  b(1, 1.2, 0.6, 0.6, 0x334); b(1.1, 1.3, 0.6, 1.85, color); b(0.8, 0.8, 0.8, 2.9, 0xffd9a0);
  g.add(label(name)); scene.add(g); return g;
}

// ---------- sieć ----------
function connect() {
  let u; try { const a = $('addr').value.trim(); u = new URL(/^https?:/.test(a) ? a : 'http://' + a); } catch { return note('Zły adres'); }
  HTTP = u.origin;
  sock = new WebSocket(HTTP.replace('http', 'ws'));
  sock.onopen = () => { show('lobby'); send({ t: 'list' }); };
  sock.onmessage = e => onMsg(JSON.parse(e.data));
  sock.onclose = () => { show('conn'); note('Rozłączono z serwerem'); };
  sock.onerror = () => note('Nie można połączyć');
}
function onMsg(m) {
  switch (m.t) {
    case 'games': fillGames(m.list); break;
    case 'load': startPlay(m); break;
    case 'join': addOther(m.p); break;
    case 'leave': { const o = others.get(m.id); if (o) { scene.remove(o.m); others.delete(m.id); } break; }
    case 'state':
      m.p.forEach(([id, x, y, z, ry]) => { const o = others.get(id); if (o) { o.t = [x, y, z]; o.r = ry; } });
      m.q.forEach(([id, x, y, z, h]) => { const p = parts.get(id); if (p) { p.mesh.position.set(x, y, z); p.hidden = !!h; p.mesh.visible = !h; } });
      break;
    case 'chat': log(m.name + ': ' + m.text); break;
    case 'respawn': respawn(); break;
    case 'tp': P = m.pos.slice(); vy = 0; break;
    case 'hud': { // timery, wyniki gracza i tablica wyników
      const r2 = v => Math.round(v * 100) / 100, L = [];
      m.timers.forEach(([n, l]) => L.push('⏱ ' + n + ': ' + l.toFixed(1) + ' s'));
      Object.entries(m.me || {}).forEach(([n, v]) => L.push(n + ': ' + r2(v)));
      if (m.board && m.board.some(([, s]) => Object.keys(s).length)) { L.push('— wyniki —'); m.board.forEach(([n, s]) => L.push(n + '   ' + Object.values(s).map(r2).join(' / '))); }
      $('info').textContent = L.join('\n'); $('info').hidden = !L.length; break;
    }
    case 'error': note(m.msg); break;
  }
}
function fillGames(list) {
  $('glist').innerHTML = '';
  list.forEach(n => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => join(n); $('glist').appendChild(b); });
}
const join = g => send({ t: 'join', game: g, name: $('nick').value.trim() || 'Gracz' });

// ---------- gra ----------
let me, P = [0, 3, 0], vy = 0, gr = false, yaw = 0, pitch = 0.4, drag = false, moved = 0, sendT = 0;
const others = new Map(), keys = {};
function addOther(p) { if (p.id === myId || others.has(p.id)) return; const m = avatar(p.color, p.name); m.position.set(...p.p); others.set(p.id, { m, t: [...p.p], r: p.ry }); }
function startPlay(m) {
  G = m.game; build(G); myId = m.id;
  m.cur.forEach(([id, x, y, z, h]) => { const p = parts.get(id); if (p) { p.mesh.position.set(x, y, z); p.hidden = !!h; p.mesh.visible = !h; } });
  others.forEach(o => scene.remove(o.m)); others.clear(); if (me) scene.remove(me);
  m.players.forEach(addOther);
  me = avatar(m.players.find(p => p.id === myId).color, $('nick').value.trim() || 'Gracz');
  respawn(); $('log').innerHTML = ''; show('hud');
}
function exitPlay() {
  send({ t: 'leave' }); others.forEach(o => scene.remove(o.m)); others.clear(); if (me) scene.remove(me); me = null;
  build({ parts: [] }); show('lobby'); send({ t: 'list' });
}
const respawn = () => { P = [...(G.spawn || [0, 3, 0])]; vy = 0; };
function hit(x, y, z) {
  for (const p of parts.values()) {
    if (!p.collide || p.hidden) continue;
    const m = p.mesh.position, s = p.size;
    if (Math.abs(x - m.x) < (s[0] + 1) / 2 && Math.abs(z - m.z) < (s[2] + 1) / 2 && y + PH > m.y - s[1] / 2 && y < m.y + s[1] / 2 - 0.01) return p;
  }
  return null;
}
function orbit(x, y, z, d) {
  cam.position.set(x + Math.sin(yaw) * Math.cos(pitch) * d, y + Math.sin(pitch) * d, z + Math.cos(yaw) * Math.cos(pitch) * d);
  cam.lookAt(x, y, z);
}
function play(dt) {
  const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  let dx = 0, dz = 0;
  if (f || s) {
    dx = -Math.sin(yaw) * f + Math.cos(yaw) * s; dz = -Math.cos(yaw) * f - Math.sin(yaw) * s;
    const l = Math.hypot(dx, dz); dx = dx / l * 10 * dt; dz = dz / l * 10 * dt; me.rotation.y = Math.atan2(dx, dz);
  }
  if (!hit(P[0] + dx, P[1], P[2])) P[0] += dx;
  if (!hit(P[0], P[1], P[2] + dz)) P[2] += dz;
  if (keys.Space && gr) { vy = 13; gr = false; }
  vy -= 35 * dt; const ny = P[1] + vy * dt, h = hit(P[0], ny, P[2]); gr = false;
  if (h) { if (vy <= 0) { P[1] = h.mesh.position.y + h.size[1] / 2; gr = true; } else P[1] = h.mesh.position.y - h.size[1] / 2 - PH - 0.001; vy = 0; }
  else P[1] = ny;
  if (G.ground && P[1] < 0) { P[1] = 0; vy = 0; gr = true; }
  if (P[1] < -60) respawn();
  me.position.set(P[0], P[1], P[2]);
  if ((sendT += dt) > 0.05) { sendT = 0; send({ t: 'pos', p: P, ry: me.rotation.y }); }
  others.forEach(o => { o.m.position.lerp(V.set(...o.t), 0.3); o.m.rotation.y += (o.r - o.m.rotation.y) * 0.3; });
  orbit(P[0], P[1] + 2.5, P[2], 9);
}

// ---------- UI / wejście ----------
$('bc').onclick = connect; $('bref').onclick = () => send({ t: 'list' });
addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (mode === 'hud') {
    if (t === 'INPUT') { if (e.key === 'Enter') { const v = $('msg').value.trim(); if (v) send({ t: 'chat', text: v }); $('msg').value = ''; $('msg').blur(); } return; }
    if (e.key === 'Enter') { $('msg').focus(); e.preventDefault(); return; }
    if (e.key === 'Escape') return exitPlay();
    if (e.code === 'Space') e.preventDefault();
  }
  if (/INPUT|TEXTAREA|SELECT/.test(t)) return;
  keys[e.code] = true;
});
addEventListener('keyup', e => keys[e.code] = false);
ren.domElement.onmousedown = () => { drag = true; moved = 0; };
addEventListener('mousemove', e => { if (drag) { yaw -= e.movementX * 0.005; pitch = Math.max(0.05, Math.min(1.5, pitch + e.movementY * 0.005)); moved += Math.abs(e.movementX) + Math.abs(e.movementY); } });
addEventListener('mouseup', e => { drag = false; });
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });

let last = performance.now();
(function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (mode === 'hud' && me) play(dt); else { cam.position.set(0, 20, 30); cam.lookAt(0, 0, 0); }
  ren.render(scene, cam);
})(last);
</script></body></html>
